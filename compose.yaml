services:
  web:
    build: .
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: production
    volumes:
      - ./downloads:/app/downloads
      - ./data:/app/data
      - ./secrets:/app/secrets
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
